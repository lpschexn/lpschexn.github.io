# ── Research section ──────────────────────────────────────────────────────────
research:
  heading: "What I Work On"
  paragraphs:
    - >-
      Autonomous vehicles have the potential to reduce transportation energy consumption
      through more efficient driving. Yet, achieving those gains require sensing that is
      precise in highway driving scenarios and all weather conditions. My research focuses
      on evaluating the ability for lidar sensing and processing systems to achieve significant
      energy savings, a benefit to the driver and to the national energy infrastructure.
    - >-
      Concretely, I investigate how lidar-derived road grade previews can replace or
      augment map-based inputs to vehicle energy management systems, and I have evaluated
      900&nbsp;nm versus 1550&nbsp;nm lidar performance under real arctic winter conditions
      — the kind of empirical, hardware-grounded work that bridges sensor physics and
      system-level autonomy. These studies are conducted on public roads and test tracks
      in the Upper Peninsula of Michigan, where the environment provides natural stress
      tests unavailable in warmer climates.
    - >-
      The larger goal is a class of autonomous vehicles that are not just capable but
      measurably more sustainable: systems that preview road geometry to minimize
      unnecessary acceleration, that platoon safely to cut aerodynamic drag, and that
      degrade gracefully when sensors are partially obscured. Looking ahead, I am
      interested in extending these perception and sensor fusion methods into
      sustainability-focused applications and, eventually, medical and biomedical
      sensing — where the same rigor applied to detecting road features must be applied
      to detecting physiological ones.
  keywords:
    - "Lidar Processing"
    - "Autonomous Vehicles"
    - "Vehicle Platooning"
    - "Energy Efficiency"
    - "Sensor Fusion"
    - "Arctic Sensing"
    - "Road Grade Estimation"

