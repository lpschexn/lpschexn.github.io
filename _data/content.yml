# ── Research section ──────────────────────────────────────────────────────────
research:
  heading: "What I Work On"
  paragraphs:
    - >-
      Autonomous vehicles have the potential to reduce transportation energy consumption
      through more efficient driving. Yet, achieving those gains require sensing that is
      precise in dynamic driving and weather scenarios. My current work focuses on evaluating 
      lidar sensing and processing systems in these scenarios. Understanding the effect of these sensing architectures
      enables engineers to make informed decisions about their autonomous vehicle's fuel economy.
    - >-
      I have implemented stochastic models to connect measurement and estimation uncertainty of 
      lidar and processing algorithms the energy saved during automated vehicle following in clear
      and adverse weather while under computational constraints. Additionally, I have demonstrated
      that automotive lidar can measure the grade of a road surface in advance of traversal, enabling
      control systems to perform energy-efficient actuation.
    - >-
      I conducted this research as part of the Robust Autonomous Systems Laboratory. I have supported 
      several other programs and projects related to sensing and autonomy during
      my time at Michigan Tech.
  keywords:
    - "Lidar Processing"
    - "Autonomous Vehicles"
    - "Stochastic Modeling"
    - "Energy Efficiency"
    - "Sustainability"
    - "Sensor Fusion"
    - "Arctic Sensing"

