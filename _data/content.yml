# ── Projects section ──────────────────────────────────────────────────────────
projects:
  heading: "Research &amp; Initiatives"
  items:
    - name: "ARPA-E NEXTCAR - Sensing and Processing"
      image: "images/nextcar_ram.png"
      desc: >-
        I implemented lidar processing algorithms for automated vehicle following and road surface profiling tasks. 
        This work supported the program goal of achieving a 20% reduction in autonomous vehicle energy consumption.
      link: "https://arpa-e.energy.gov/programs-and-initiatives/search-all-projects/hybrid-electric-vehicle-platooning-control"
      link_text: "View Project Description"

    - name: "AutoDrive Challenge II"
      image: "images/ADII_banner.png"
      image_alt: "AutoDrive Challenge II team banner"
      desc: >-
        A collegiate autonomous vehicle competition hosted by General Motors and SAE.
        I mentored undergraduate students in simulation, perception, localization, and systems engineering. 
        Our team has recieved nine awards in design and dynamic challenges over five years.
      link: "https://rse-mtu.vercel.app/"
      link_text: "Visit project"

    - name: "Lidar-Based Road Grade Preview for Energy Management"
      desc: >-
        Developed and evaluated lidar-derived road grade signals as real-time inputs to
        vehicle energy management systems. Compared lidar-based grade preview against
        map-based approaches for accuracy and latency in dynamic driving conditions.
      link: "https://arxiv.org/abs/2511.02006"
      link_text: "Read preprint"

    - name: "Adverse Weather Assessment of Automotive Lidar"
      image: "images/car_snow.jpg"
      image_alt: "Image of experiment setup for assessing position estimation performance in snow"
      desc: >-
        Evaluated the precision of lidar measurements in the arctic winter conditions 
        of Michigan's Upper Peninsula. Developed model to characterize the effect of
        residual clutter on object position estimation algorithms.

      link: ""
      link_text: ""

    - name: "Robotics and Automation Society - Michigan Tech Student Branch"
      image: "images/ras_maze.png"
      desc: >-
        Acted as Vice Chair in the first semester of the MTU RAS student branch chapter.
        Organized lab tours and path planning hackathon for undergraduate and graduate robotics students.
      link: "https://www.ieee-ras.org/"
      link_text: "Robotics and Automation Society Page"

# ── Research vision section ───────────────────────────────────────────────────
vision:
  heading: "Research Vision"
  paragraphs:
    - >-
      I am actively seeking postdoctoral-level positions with a focus on autonomous systems, 
      sustainable transportation, and sensing &amp; processing. My near-term goal is to 
      continue the work of using robust, low-latency sensing and stochastic modeling for a more 
      general class of energy-critical applications to reduce resource consumption or improve safety outcomes.
#    - >-
      In parallel, I am interested in developing a research agenda at the intersection
      of robust perception and human health. I see an opportunity to bridge these domains,
      #The same uncertainty modeling used in autonomous vehicles
      #can be applied to medical sensing: detecting subtle signals in noisy environments, fusing
      #heterogeneous modalities, and operating reliably at the edge. 
      and I am looking for environments that support interdisciplinary applications.
    - >-
      If your work relates to this sustainability or any of my interests, I would be glad to connect.
  tags:
    # - "Start date: 2026–2027"

