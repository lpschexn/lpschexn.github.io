# ── Research vision section ───────────────────────────────────────────────────
vision:
  heading: "Research Vision"
  paragraphs:
    - >-
      I am actively seeking postdoctoral and faculty positions beginning in 2026–2027,
      with a focus on autonomous systems, sustainable transportation, and sensing &amp;
      perception. My near-term goal is to extend the lidar and sensor fusion methods
      developed during my PhD toward a broader class of energy-critical applications —
      systems where robust, low-latency sensing directly translates to reduced resource
      consumption or improved safety outcomes.
    - >-
      In parallel, I am interested in developing a research agenda at the intersection
      of robust perception and human health. The same pipeline engineering that enables
      a vehicle to perceive road grade in a snowstorm has structural analogues in
      medical sensing: detecting subtle signals in noisy environments, fusing
      heterogeneous modalities, and operating reliably at the edge. I see a genuine
      opportunity to bridge these domains, and I am looking for environments — national
      labs, R1/R2 research universities — that support that kind of cross-disciplinary
      ambition.
    - >-
      I am particularly drawn to institutions and groups where sustainability is not
      just a framing device but a genuine research priority: reducing emissions through
      intelligent logistics, enabling energy-efficient mobility in underserved or
      extreme-climate regions, and building autonomous systems that earn public trust
      through transparency and measured performance. If your work touches any of these
      areas, I would be glad to connect.
  tags:
    - "Postdoctoral positions"
    - "R1/R2 faculty (tenure-track)"
    - "National labs (NREL, Argonne, Oak Ridge)"
    - "Start date: 2026–2027"

